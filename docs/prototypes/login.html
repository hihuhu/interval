<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interval - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        [v-cloak] { display: none; }
        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.3s ease;
        }
        .fade-enter-from, .fade-leave-to {
            opacity: 0;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-purple-50 min-h-screen">
    <div id="app" v-cloak class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <!-- Logo and Title -->
            <div class="text-center mb-8">
                <h1 class="text-5xl font-bold text-indigo-600 mb-2">Interval</h1>
                <p class="text-gray-600 text-lg">时间记录从这里开始</p>
            </div>

            <!-- Login Card -->
            <div class="bg-white rounded-2xl shadow-xl p-8">
                <h2 class="text-2xl font-semibold text-gray-900 mb-6">登录</h2>

                <!-- Error Message -->
                <transition name="fade">
                    <div v-if="errorMessage" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg flex items-start gap-2">
                        <svg class="w-5 h-5 text-red-500 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                        </svg>
                        <span class="text-sm text-red-700">{{ errorMessage }}</span>
                    </div>
                </transition>

                <!-- Login Form -->
                <form @submit.prevent="handleLogin">
                    <div class="space-y-4">
                        <!-- Username -->
                        <div>
                            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
                                用户名
                            </label>
                            <input
                                id="username"
                                v-model="username"
                                type="text"
                                required
                                :disabled="isLoading"
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all disabled:bg-gray-100 disabled:cursor-not-allowed"
                                placeholder="请输入用户名"
                            />
                        </div>

                        <!-- Password -->
                        <div>
                            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                                密码
                            </label>
                            <input
                                id="password"
                                v-model="password"
                                type="password"
                                required
                                :disabled="isLoading"
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all disabled:bg-gray-100 disabled:cursor-not-allowed"
                                placeholder="请输入密码"
                            />
                        </div>

                        <!-- Login Button -->
                        <button
                            type="submit"
                            :disabled="isLoading"
                            class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-medium hover:bg-indigo-700 focus:ring-4 focus:ring-indigo-200 transition-all disabled:bg-indigo-400 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                        >
                            <svg v-if="isLoading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span>{{ isLoading ? '登录中...' : '登录' }}</span>
                        </button>
                    </div>
                </form>

                <!-- Register Link -->
                <div class="mt-6 text-center">
                    <p class="text-sm text-gray-600">
                        还没有账号？
                        <a href="#" @click.prevent="showRegisterHint" class="text-indigo-600 hover:text-indigo-700 font-medium">
                            注册
                        </a>
                    </p>
                </div>
            </div>

            <!-- Demo Hint -->
            <div class="mt-6 bg-blue-50 border border-blue-200 rounded-xl p-4">
                <h3 class="text-sm font-semibold text-blue-900 mb-2">💡 原型演示提示</h3>
                <p class="text-sm text-blue-700 mb-2">
                    这是一个前端原型，暂未连接后端 API。
                </p>
                <p class="text-sm text-blue-700">
                    输入任意用户名和密码，点击"登录"即可跳转到 Time Grid 主页。
                </p>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        
        createApp({
            data() {
                return {
                    username: '',
                    password: '',
                    errorMessage: '',
                    isLoading: false
                };
            },
            methods: {
                async handleLogin() {
                    // Clear previous error
                    this.errorMessage = '';

                    // Basic validation
                    if (!this.username.trim()) {
                        this.errorMessage = '请输入用户名';
                        return;
                    }

                    if (!this.password.trim()) {
                        this.errorMessage = '请输入密码';
                        return;
                    }

                    // Simulate loading
                    this.isLoading = true;

                    // Simulate API call delay
                    setTimeout(() => {
                        // In real implementation, this would be:
                        // const response = await fetch('/api/auth/login', {
                        //     method: 'POST',
                        //     headers: { 'Content-Type': 'application/json' },
                        //     body: JSON.stringify({
                        //         username: this.username,
                        //         password: this.password
                        //     })
                        // });
                        // const data = await response.json();
                        // if (data.result === 'SUCCESS') {
                        //     localStorage.setItem('token', data.data.token);
                        //     localStorage.setItem('username', data.data.username);
                        //     window.location.href = 'time-grid-v1.html';
                        // } else {
                        //     this.errorMessage = data.message;
                        // }

                        // For prototype: simulate successful login
                        localStorage.setItem('username', this.username);
                        localStorage.setItem('token', 'demo-jwt-token-' + Date.now());
                        
                        // Redirect to time grid
                        window.location.href = 'time-grid-simple.html';
                    }, 800);
                },
                showRegisterHint() {
                    alert('注册功能将在后端实现后开放。\n\n当前原型阶段，请直接使用任意用户名登录体验。');
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
